# The Datalib app: datalib's web UI (datalib-http) over the store the datalib
# skill writes. system/apps/datalib/launch_datalib_http.py (standard library
# only, like forward_port.py) registers the app's manifest with the API token
# on its launch path and the datalib-http port 8731 via forward_port.py, then
# execs ~/.local/bin/datalib-http, which system/scripts/env.d/2000-datalib-binaries.sh
# installs on the env-converge one-shot.
#
# autostart=false: datalib is not announced to users yet. An app is listed
# only once its program has registered it, so a workspace shows no Datalib
# app until the datalib skill starts this program (`supervisorctl start
# datalib`), which it does only for a user who asked for datalib by name.
# Carries the `user` band -- shed before any built-in.
[program:datalib]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/apps/datalib/launch_datalib_http.py
directory=/home/user/workspace
autostart=false
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/datalib-stdout.log
stderr_logfile=/var/log/supervisor/datalib-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
