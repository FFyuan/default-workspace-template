# Publishes the container's own memory headroom, read from its cgroup, into the
# file earlyoom reads with --host-meminfo (earlyoom.conf). Under runc the
# container's /proc/meminfo is the host kernel's, so without this earlyoom's
# thresholds would track the whole machine while the cgroup OOM killer acts at
# the workspace's cap. It steps aside under gVisor (the sandbox's cgroupfs is
# its own view; on a gen-2 slice the VM publishes the file from outside) and
# leaves no file while the container is uncapped or on lima (no cgroup cap), so
# earlyoom reads /proc/meminfo alone there. See
# system/services/oom_priority/src/oom_priority/cgroup_meminfo.py. No
# oom_tag_service.py prefix: it is part of the OOM machinery and stays PROTECTED
# (bands._NON_SERVICE_PROGRAM_BANDS), like earlyoom and the backstop listener.
[program:publish-cgroup-meminfo]
command=python3 system/services/oom_priority/bin/publish_cgroup_meminfo.py
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/var/log/supervisor/publish-cgroup-meminfo-stdout.log
stderr_logfile=/var/log/supervisor/publish-cgroup-meminfo-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
