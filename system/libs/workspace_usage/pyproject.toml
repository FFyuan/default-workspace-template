[project]
name = "workspace-usage"
version = "0.1.0"
description = "Reports every model call a workspace app makes to the workspace's usage collector: the IMBUE_USAGE_CONTEXT attribution, model_call event building, emit-or-spool delivery, Claude Code telemetry settings for claude -p, and a LiteLLM callback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-manifest",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.88.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_usage"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
