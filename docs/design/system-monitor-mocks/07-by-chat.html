<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System (by chat)</title>
<link rel="stylesheet" href="shared/mock.css">
<style>
  /* Organised around the things a user can act on, not the resources: one card per chat, app,
     and the workspace itself, each with its CPU and memory and a way to stop it. The machine's
     totals are a thin strip at the top, with the memory guard's threshold drawn in. */
  .totals { display: grid; gap: 6px; margin-bottom: 4px; }
  .total { display: grid; grid-template-columns: 56px 1fr 120px; align-items: center; gap: 10px; font-size: var(--font-size-row); }
  .total .bar { margin: 0; position: relative; overflow: visible; }
  .total .bar .guard { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--c-danger); opacity: 0.7; }
  .total .v { text-align: right; color: var(--c-text-secondary); font-variant-numeric: tabular-nums; }
  .total .v b { color: var(--c-text-primary); }
  .cards { display: grid; gap: 8px; }
  .card { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--c-border); border-radius: var(--radius-lg); background: var(--c-surface); }
  .card .title { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px; font-weight: var(--weight-semibold); }
  .card .title .kind { font-weight: var(--weight-regular); color: var(--c-text-faint); font-size: var(--font-size-helper); }
  .card .actions { grid-column: 2; grid-row: 1 / 3; align-self: center; display: flex; gap: 4px; }
  .card .stats { grid-column: 1; grid-row: 2; display: flex; gap: 14px; font-size: var(--font-size-helper); color: var(--c-text-secondary); font-variant-numeric: tabular-nums; }
  .card .stats b { color: var(--c-text-primary); font-weight: var(--weight-semibold); }
  .card .stats .mini { display: inline-block; width: 48px; height: 4px; border-radius: 2px; background: var(--c-border); vertical-align: 1px; margin-left: 4px; overflow: hidden; }
  .card .stats .mini i { display: block; height: 100%; }
  .card.hot { border-color: color-mix(in srgb, var(--c-warning) 40%, var(--c-border)); }
  .card.quiet .title { color: var(--c-text-secondary); font-weight: var(--weight-regular); }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 6px; }
  .group-head:first-child { margin-top: 0; }
  .group-head .sum { font-size: var(--font-size-helper); color: var(--c-text-faint); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="page">
  <header class="page-header">
    <h1>Who's using what</h1>
    <button type="button" class="btn ghost quiet">Stop idle chats</button>
  </header>

  <section class="section">
    <div class="totals" id="totals"></div>
    <div class="note warn" style="margin-top:10px"><strong>Memory is 64% full.</strong> Two idle chats hold 1.0 GB; stopping them frees most of it. Above 90% the workspace stops programs itself.</div>
  </section>

  <section class="section" id="cards"></section>
</main>
<script src="shared/mock.js"></script>
<script>
(() => {
  const M = window.MOCK, $ = (id) => document.getElementById(id);
  const mp = M.pct(M.memory.used, M.memory.total), dp = M.pct(M.disk.used, M.disk.total), cp = Math.round(M.cpu.pct);
  $("totals").innerHTML = [
    ["CPU", cp, "cpu", `<b>${cp}%</b> busy`, ""],
    ["Memory", mp, "mem", `<b>${M.size(M.memory.used)}</b> of ${M.size(M.memory.total)}`, `<i class="guard" style="left:90%" title="The memory guard starts stopping programs at 90%"></i>`],
    ["Disk", dp, "disk", `<b>${M.sizeDecimal(M.disk.used)}</b> of ${M.sizeDecimal(M.disk.total)}`, ""],
  ].map(([n, p, cls, v, extra]) => `<div class="total"><span>${n}</span><div class="bar thin"><span class="${cls}" style="width:${p}%"></span>${extra}</div><span class="v">${v}</span></div>`).join("");

  const mini = (v, max, color) => `<span class="mini"><i style="width:${Math.min(100, (v / max) * 100)}%;background:${color}"></i></span>`;
  const stat = (c) => `<span class="stats"><span>CPU <b>${c.cpu.toFixed(c.cpu < 10 ? 1 : 0)}%</b>${mini(c.cpu, 100, "var(--ink-cpu)")}</span><span>Memory <b>${M.size(c.mem)}</b>${mini(c.mem, 2 * M.GiB, "var(--ink-mem)")}</span>${c.extra || ""}</span>`;
  const card = (c, kind, actions, cls = "") => `<div class="card ${cls}"><div class="title">${c.state !== undefined ? `<span class="dot ${c.state === "working" ? "live" : ""}"></span>` : ""}${M.esc(c.name)}<span class="kind">${kind}</span></div>${stat(c)}<div class="actions">${actions}</div></div>`;
  const chats = M.chats.map((c) => ({ ...c, extra: `<span>${c.state === "working" ? "working" : `idle ${c.since}`}</span>` }));
  const chatSum = chats.reduce((a, c) => a + c.mem, 0);
  $("cards").innerHTML = `
    <div class="group-head"><h2 class="type-section">Chats</h2><span class="sum">${chats.length} open · ${M.size(chatSum)}</span></div>
    <div class="cards">${chats.map((c) => card(c, c.model, `<button type="button" class="btn ghost quiet">Open</button><button type="button" class="btn danger-ghost quiet">Stop</button>`, c.state === "working" ? "hot" : "quiet")).join("")}</div>
    <div class="group-head"><h2 class="type-section">Code checkers</h2><span class="sum">1 running · 534 MB</span></div>
    <div class="cards">${M.checkers.map((c) => card({ ...c, name: `TypeScript checker` , extra: `<span>for ${M.esc(c.name)}</span>` }, "", `<button type="button" class="btn danger-ghost quiet">Stop</button>`)).join("")}</div>
    <div class="group-head"><h2 class="type-section">Your apps</h2><span class="sum">2 running · 310 MB</span></div>
    <div class="cards">${M.apps.map((a) => card(a, "", `<button type="button" class="btn ghost quiet">Open</button><button type="button" class="btn danger-ghost quiet">Quit</button>`)).join("")}</div>
    <div class="group-head"><h2 class="type-section">Workspace</h2><span class="sum">880 MB + 612 MB shared</span></div>
    <div class="cards">${card({ name: "Chat, desktop, built-in apps and services", cpu: 3.9, mem: 880 * M.MiB }, "", `<button type="button" class="btn ghost quiet" title="The workspace's own programs cannot be stopped from here">Details</button>`)}</div>`;
})();
</script>
</body>
</html>
