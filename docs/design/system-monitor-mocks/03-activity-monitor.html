<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System (Activity Monitor)</title>
<link rel="stylesheet" href="shared/mock.css">
<style>
  /* After macOS Activity Monitor: a toolbar, a sortable process table that fills the window, and
     a summary pane pinned to the bottom with the figures and a small graph for the chosen resource. */
  body { overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; background: var(--c-surface); }
  .toolbar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--c-border); background: var(--c-bg); flex: none; }
  .toolbar h1 { font-size: var(--font-size-body); font-weight: var(--weight-semibold); margin-right: auto; }
  .search { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid var(--c-border-strong); border-radius: var(--radius-md); background: var(--c-surface); color: var(--c-text-faint); font-size: var(--font-size-helper); width: 120px; }
  .table-wrap { flex: 1; min-height: 0; overflow: auto; }
  table.proc { width: 100%; border-collapse: collapse; font-size: var(--font-size-row); font-variant-numeric: tabular-nums; }
  table.proc th { position: sticky; top: 0; z-index: 1; background: var(--c-surface); text-align: left; font-weight: var(--weight-regular); color: var(--c-text-secondary); font-size: var(--font-size-helper); padding: 6px 10px; border-bottom: 1px solid var(--c-border); cursor: pointer; white-space: nowrap; }
  table.proc th.n, table.proc td.n { text-align: right; }
  table.proc th[aria-sort] { color: var(--c-text-primary); font-weight: var(--weight-semibold); }
  table.proc th[aria-sort]::after { content: " ▾"; color: var(--c-text-faint); }
  table.proc td { padding: 5px 10px; border-bottom: 1px solid var(--c-border-faint); white-space: nowrap; }
  table.proc tbody tr:hover { background: var(--c-fill-hover); }
  table.proc tbody tr[aria-selected="true"] { background: var(--c-accent-light); }
  table.proc td.name { display: flex; align-items: center; gap: 8px; }
  .kind { color: var(--c-text-faint); }
  .glyph { width: 16px; height: 16px; border-radius: 4px; flex: none; display: inline-grid; place-items: center; font-size: 9px; font-weight: var(--weight-bold); color: #fff; }
  .summary { flex: none; display: grid; grid-template-columns: 1fr 160px 1fr; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--c-border); background: var(--c-bg); }
  .summary .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: var(--font-size-helper); align-content: start; }
  .summary .facts span:nth-child(odd) { color: var(--c-text-secondary); }
  .summary .facts span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  .summary .graph { display: flex; flex-direction: column; gap: 4px; }
  .summary .graph .label { text-align: center; font-size: var(--font-size-helper); color: var(--c-text-secondary); }
  .summary svg { width: 100%; height: 56px; display: block; border-radius: var(--radius-sm); background: var(--c-surface-secondary); }
  .summary .graph .value { text-align: center; font-size: var(--font-size-heading); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
  .footer { flex: none; display: flex; justify-content: space-between; padding: 4px 12px 6px; font-size: var(--font-size-helper); color: var(--c-text-faint); background: var(--c-bg); }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1>System</h1>
    <div class="seg" role="radiogroup" aria-label="Resource" id="seg">
      <button role="radio" aria-checked="true" data-r="cpu">CPU</button>
      <button role="radio" aria-checked="false" data-r="memory">Memory</button>
      <button role="radio" aria-checked="false" data-r="disk">Disk</button>
      <button role="radio" aria-checked="false" data-r="events">Events</button>
    </div>
    <div class="search"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>Search</div>
  </div>
  <div class="table-wrap">
    <table class="proc" id="table">
      <thead><tr><th>Process</th><th class="n" aria-sort="descending">% CPU</th><th class="n">Memory</th><th>Kind</th><th>State</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="summary" id="summary"></div>
  <div class="footer"><span>142 processes, 611 threads</span><span>Updated 2 s ago</span></div>
</div>
<script src="shared/mock.js"></script>
<script>
(() => {
  const M = window.MOCK, $ = (id) => document.getElementById(id);
  const colorOf = { chat: "#2f6b4f", checker: "#7096b7", app: "#97630c", workspace: "#8c8c8c" };
  const letter = { chat: "C", checker: "T", app: "A", workspace: "W" };
  const procs = [
    ...M.chats.map((c) => ({ name: c.name, cpu: c.cpu, mem: c.mem, kind: "chat", kindLabel: "Chat", state: c.state === "working" ? "Working" : "Idle" })),
    ...M.checkers.map((c) => ({ name: `tsserver (${c.name})`, cpu: c.cpu, mem: c.mem, kind: "checker", kindLabel: "Code checker", state: "Running" })),
    ...M.apps.map((a) => ({ name: a.name, cpu: a.cpu, mem: a.mem, kind: "app", kindLabel: "Your app", state: "Running" })),
    { name: "Chat app", cpu: 1.9, mem: 310 * M.MiB, kind: "workspace", kindLabel: "Workspace", state: "Running" },
    { name: "Desktop", cpu: 0.8, mem: 240 * M.MiB, kind: "workspace", kindLabel: "Workspace", state: "Running" },
    { name: "Files", cpu: 0.2, mem: 96 * M.MiB, kind: "workspace", kindLabel: "Workspace", state: "Running" },
    { name: "Backup", cpu: 0.6, mem: 88 * M.MiB, kind: "workspace", kindLabel: "Service", state: "Running" },
    { name: "Memory guard", cpu: 0.1, mem: 4 * M.MiB, kind: "workspace", kindLabel: "Service", state: "Running" },
    { name: "Terminal", cpu: 0.0, mem: 52 * M.MiB, kind: "workspace", kindLabel: "Workspace", state: "Running" },
  ];
  let sortKey = "cpu";
  function renderTable() {
    const rows = [...procs].sort((a, b) => (sortKey === "name" ? a.name.localeCompare(b.name) : b[sortKey] - a[sortKey]));
    $("table").querySelector("tbody").innerHTML = rows.map((p, i) => `<tr aria-selected="${i === 0 && sortKey === "cpu"}">
      <td class="name"><span class="glyph" style="background:${colorOf[p.kind]}">${letter[p.kind]}</span>${M.esc(p.name)}</td>
      <td class="n">${p.cpu.toFixed(1)}</td><td class="n">${M.size(p.mem)}</td><td class="kind">${p.kindLabel}</td><td class="kind">${p.state}</td></tr>`).join("");
  }
  const heads = $("table").querySelectorAll("th");
  const keys = ["name", "cpu", "mem", null, null];
  heads.forEach((h, i) => h.addEventListener("click", () => {
    if (!keys[i]) return;
    sortKey = keys[i];
    heads.forEach((o, j) => (keys[j] === sortKey ? o.setAttribute("aria-sort", "descending") : o.removeAttribute("aria-sort")));
    renderTable();
  }));
  renderTable();

  const panes = {
    cpu: { facts: [["System", "6.3%"], ["Chats", "24.4%"], ["Code checkers", "5.9%"], ["Idle", "63.3%"]], right: [["Load", "1.48"], ["Cores", "4"], ["Processes", "142"], ["Threads", "611"]], label: "CPU load", value: "37%", series: M.history.cpu10, color: "var(--ink-cpu)" },
    memory: { facts: [["Physical memory", "8.0 GB"], ["Memory used", "5.1 GB"], ["Temporary files", "241 MB"], ["Shared", "612 MB"]], right: [["Chats", "2.4 GB"], ["Code checkers", "534 MB"], ["Your apps", "310 MB"], ["Available", "2.9 GB"]], label: "Memory pressure", value: "64%", series: M.history.mem10, color: "var(--ink-mem)" },
    disk: { facts: [["Capacity", "28 GB"], ["Used", "11.4 GB"], ["Free", "16.6 GB"], ["Backed up", "14 min ago"]], right: [["Workspace files", "3.1 GB"], ["Package caches", "2.4 GB"], ["Uploads", "1.2 GB"], ["App data", "0.9 GB"]], label: "Disk used", value: "41%", series: M.history.disk60, color: "var(--ink-disk)" },
    events: { facts: [["9:42 AM", "Stopped a code checker"], ["8:05 AM", "CPU above 90% for 6 min"], ["Yesterday", "Stopped a test browser"]], right: [["Stops today", "1"], ["Stops this week", "4"], ["High CPU", "2"], ["Restarts", "0"]], label: "Memory stops", value: "1 today", series: null, color: "" },
  };
  function renderSummary(r) {
    const p = panes[r];
    $("summary").innerHTML = `<div class="facts">${p.facts.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>
      <div class="graph"><div class="label">${p.label}</div>${p.series ? `<svg id="sgraph"></svg>` : `<svg></svg>`}<div class="value">${p.value}</div></div>
      <div class="facts">${p.right.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>`;
    if (p.series) M.drawMiniSpark($("sgraph"), p.series, { windowMs: r === "disk" ? 60 * 60e3 : 10 * 60e3, color: p.color, h: 56 });
  }
  $("seg").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    $("seg").querySelectorAll("button").forEach((o) => o.setAttribute("aria-checked", String(o === b)));
    renderSummary(b.dataset.r);
    sortKey = b.dataset.r === "memory" ? "mem" : "cpu";
    heads.forEach((o, j) => (keys[j] === sortKey ? o.setAttribute("aria-sort", "descending") : o.removeAttribute("aria-sort")));
    renderTable();
  }));
  renderSummary("cpu");
})();
</script>
</body>
</html>
