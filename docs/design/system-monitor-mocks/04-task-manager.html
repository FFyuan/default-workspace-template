<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System (Task Manager)</title>
<link rel="stylesheet" href="shared/mock.css">
<style>
  /* After Windows Task Manager's Performance tab: a list of resources down the left, each with a
     thumbnail graph, and a large graph with a details grid for the chosen one on the right.
     At 600px the list stacks above the detail. */
  body { overflow: hidden; }
  .app { display: grid; grid-template-columns: 180px 1fr; height: 100%; }
  .list { border-right: 1px solid var(--c-border); background: var(--c-bg-sidebar); padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .list h1 { font-size: var(--font-size-helper); font-weight: var(--weight-semibold); color: var(--c-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 8px; }
  .res { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; cursor: pointer; }
  .res:hover { background: var(--c-fill-hover); }
  .res[aria-current="true"] { background: var(--c-surface); box-shadow: var(--shadow-raised); }
  .res svg { width: 44px; height: 30px; border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-surface); }
  .res .name { font-size: var(--font-size-row); font-weight: var(--weight-semibold); line-height: 1.2; }
  .res .val { font-size: var(--font-size-helper); color: var(--c-text-secondary); font-variant-numeric: tabular-nums; }
  .detail { padding: 16px 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .detail .head { display: flex; justify-content: space-between; align-items: baseline; }
  .detail .head h2 { font-size: var(--font-size-heading); font-weight: var(--weight-semibold); }
  .detail .head span { color: var(--c-text-secondary); font-size: var(--font-size-row); }
  .graph-title { display: flex; justify-content: space-between; font-size: var(--font-size-helper); color: var(--c-text-secondary); }
  .graph { border: 1px solid var(--c-border); border-radius: var(--radius-sm); background: var(--c-surface); }
  .graph svg.spark { height: 160px; }
  .cores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cores svg { width: 100%; height: 44px; border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-surface); }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
  .kv div span { display: block; }
  .kv .k { font-size: var(--font-size-helper); color: var(--c-text-secondary); }
  .kv .v { font-size: 20px; font-weight: var(--weight-semibold); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kv .v.text { font-size: var(--font-size-body); line-height: 1.5; }
  .kv .v small { font-size: var(--font-size-helper); font-weight: var(--weight-regular); color: var(--c-text-secondary); }
  .specs { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: var(--font-size-helper); border-top: 1px solid var(--c-border-faint); padding-top: 10px; }
  .specs span:nth-child(odd) { color: var(--c-text-secondary); }
  @media (max-width: 520px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .list { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--c-border); } .list h1 { display: none; } }
</style>
</head>
<body>
<div class="app">
  <nav class="list" id="list">
    <h1>Performance</h1>
  </nav>
  <section class="detail" id="detail"></section>
</div>
<script src="shared/mock.js"></script>
<script>
(() => {
  const M = window.MOCK, $ = (id) => document.getElementById(id);
  const W = 60 * 60e3;
  const resources = {
    cpu: { name: "CPU", val: "37%", sub: "4 cores", series: M.history.cpu60, color: "var(--ink-cpu)", title: "% busy over 60 seconds", top: "100%",
      kv: [["Usage", "37", "%"], ["Load", "1.48", "1 min"], ["Processes", "142", ""], ["Threads", "611", ""], ["Up time", "2 d 6 h", ""], ["Busiest", "Website redesign", "24%"]],
      specs: [["Cores", "4 vCPU (AMD EPYC)"], ["Machine size", "8 units"], ["Runtime", "gVisor"]], cores: true },
    memory: { name: "Memory", val: "5.1/8.0 GB (64%)", sub: "", series: M.history.mem60, color: "var(--ink-mem)", title: "Memory in use", top: "8.0 GB",
      kv: [["In use", "5.1", "GB"], ["Available", "2.9", "GB"], ["Chats", "2.4", "GB"], ["Shared", "612", "MB"], ["Temporary files", "241", "MB"], ["Stops today", "1", ""]],
      specs: [["Total", "8.0 GB (8 units, grows on restart)"], ["Guard", "stops programs below 10% free"], ["Last stop", "9:42 AM, a code checker"]], cores: false },
    disk: { name: "Disk", val: "41%", sub: "11.4 of 28 GB", series: M.history.disk60, color: "var(--ink-disk)", title: "Disk in use", top: "28 GB",
      kv: [["Used", "11.4", "GB"], ["Free", "16.6", "GB"], ["Workspace files", "3.1", "GB"], ["Package caches", "2.4", "GB"], ["Uploads", "1.2", "GB"], ["Backed up", "14", "min ago"]],
      specs: [["Disk", "/dev/vda1, grow-only"], ["Can grow to", "56 GB"], ["Backup", "every 15 min, encrypted"]], cores: false },
  };
  const list = $("list");
  for (const [id, r] of Object.entries(resources)) {
    const b = document.createElement("button");
    b.className = "res"; b.dataset.id = id; b.type = "button";
    b.innerHTML = `<svg id="thumb-${id}"></svg><span><span class="name">${r.name}</span><br><span class="val">${r.val}${r.sub ? ` · ${r.sub}` : ""}</span></span>`;
    b.addEventListener("click", () => show(id));
    list.appendChild(b);
    M.drawMiniSpark(b.querySelector("svg"), r.series, { windowMs: W, color: r.color, h: 30 });
  }
  function show(id) {
    const r = resources[id];
    list.querySelectorAll(".res").forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
    $("detail").innerHTML = `<div class="head"><h2>${r.name}</h2><span>${r.specs[0][1]}</span></div>
      <div class="graph-title"><span>${r.title} · last 60 minutes</span><span>${r.top}</span></div>
      <div class="graph"><svg class="spark" id="main"></svg></div>
      ${r.cores ? `<div class="cores">${M.cpu.perCore.map((p, i) => `<svg id="core-${i}" aria-label="core ${i + 1}, ${p}%"></svg>`).join("")}</div>` : ""}
      <div class="kv">${r.kv.map(([k, v, u]) => `<div><span class="k">${k}</span><span class="v${/^[\d.]/.test(v) ? "" : " text"}">${v}${u ? ` <small>${u}</small>` : ""}</span></div>`).join("")}</div>
      <div class="specs">${r.specs.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>`;
    M.drawSpark($("main"), [{ name: r.name, samples: r.series, color: r.color, areaOpacity: 0.12, format: id === "memory" ? (v) => M.size(v * M.memory.total) : id === "disk" ? (v) => M.sizeDecimal(v * M.disk.total) : undefined }], { windowMs: W, h: 100, full: false, gapMs: 30000 });
    if (r.cores) M.cpu.perCore.forEach((p, i) => M.drawMiniSpark($(`core-${i}`), M.history.cores60[i], { windowMs: W, color: r.color, h: 44 }));
  }
  show("cpu");
})();
</script>
</body>
</html>
