<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace &amp; AI usage</title>
<link rel="stylesheet" href="shared/mock.css">
<style>
  /* Resources and AI usage on one page. The machine's three meters are compact rows at the top;
     the rest is what the chats are spending: tokens and cost today, the subscription's rate-limit
     windows (or the monthly budget on Imbue Cloud), and the cost per chat. */
  .meters { display: grid; gap: 10px; }
  .meter { display: grid; grid-template-columns: 64px 1fr 110px; align-items: center; gap: 12px; }
  .meter .name { font-size: var(--font-size-row); font-weight: var(--weight-semibold); }
  .meter .bar { margin: 0; }
  .meter .val { text-align: right; font-size: var(--font-size-row); color: var(--c-text-secondary); font-variant-numeric: tabular-nums; }
  .meter .val b { color: var(--c-text-primary); font-weight: var(--weight-semibold); }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { padding: 8px 10px; border-radius: var(--radius-md); background: var(--c-surface-secondary); }
  .stat .k { font-size: var(--font-size-helper); color: var(--c-text-secondary); }
  .stat .v { font-size: var(--font-size-heading); font-weight: var(--weight-semibold); line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: var(--font-size-helper); font-weight: var(--weight-regular); color: var(--c-text-faint); }
  .windows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .win { padding: 10px 12px; border: 1px solid var(--c-border); border-radius: var(--radius-lg); background: var(--c-surface); }
  .win .k { display: flex; justify-content: space-between; font-size: var(--font-size-helper); color: var(--c-text-secondary); }
  .win .bar { margin: 8px 0 6px; }
  .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 48px; margin-top: 8px; }
  .hours i { display: block; border-radius: 2px 2px 0 0; background: var(--c-accent); opacity: 0.85; min-height: 2px; }
  .hours i.now { background: var(--c-text-primary); }
  .hours-axis { display: flex; justify-content: space-between; font-size: var(--font-size-tag); color: var(--c-text-faint); margin-top: 4px; }
  table.rows th.n { width: 70px; }
  .share { display: inline-block; width: 60px; height: 4px; border-radius: 2px; background: var(--c-border); vertical-align: 2px; margin-right: 8px; overflow: hidden; }
  .share i { display: block; height: 100%; background: var(--c-accent); }
</style>
</head>
<body>
<main class="page">
  <header class="page-header">
    <h1>Usage</h1>
    <span class="type-helper secondary">Today · <span class="num">Oct 20</span></span>
  </header>

  <section class="section">
    <h2 class="type-section">Machine</h2>
    <div class="meters" id="meters"></div>
  </section>

  <section class="section">
    <h2 class="type-section">AI usage <span class="tag">today</span></h2>
    <div class="stat-row" id="stats"></div>
    <div class="chart">
      <p class="chart-title"><span>Spend by hour</span><span class="num">$6.42 today · $31.80 this week</span></p>
      <div class="hours" id="hours"></div>
      <div class="hours-axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>now</span></div>
    </div>
    <div class="windows" id="windows"></div>
    <div class="note" id="plan"></div>
  </section>

  <section class="section">
    <h2 class="type-section">By chat</h2>
    <table class="rows" id="chats"><thead><tr><th></th><th class="n">Turns</th><th class="n">Tokens</th><th class="n">Cost</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script src="shared/mock.js"></script>
<script>
(() => {
  const M = window.MOCK, $ = (id) => document.getElementById(id);
  const mp = M.pct(M.memory.used, M.memory.total), dp = M.pct(M.disk.used, M.disk.total), cp = Math.round(M.cpu.pct);
  $("meters").innerHTML = [
    ["CPU", cp, "cpu", `<b>${cp}%</b> of 4 cores`],
    ["Memory", mp, "mem", `<b>${M.size(M.memory.used)}</b> of ${M.size(M.memory.total)}`],
    ["Disk", dp, "disk", `<b>${M.sizeDecimal(M.disk.used)}</b> of ${M.sizeDecimal(M.disk.total)}`],
  ].map(([n, p, cls, v]) => `<div class="meter"><span class="name">${n}</span><div class="bar"><span class="${cls}" style="width:${p}%"></span></div><span class="val">${v}</span></div>`).join("");

  const t = M.tokens;
  $("stats").innerHTML = [
    ["Cost", `$${t.today.cost.toFixed(2)}`, ""], ["Turns", t.today.turns, ""], ["Input", M.tokensShort(t.today.input + t.today.cacheRead), `<small>${Math.round(t.today.cacheRead / (t.today.input + t.today.cacheRead) * 100)}% cached</small>`], ["Output", M.tokensShort(t.today.output), ""],
  ].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v} ${s}</div></div>`).join("");
  const maxH = Math.max(...t.hourly.map((h) => h.v));
  $("hours").innerHTML = t.hourly.map((h, i) => `<i style="height:${Math.max(4, (h.v / maxH) * 100)}%" class="${i === 23 ? "now" : ""}" title="${i}:00 · $${(h.v * 0.9).toFixed(2)}"></i>`).join("");
  $("windows").innerHTML = t.windows.map((w) => `<div class="win"><div class="k"><span>${w.label}</span><span class="num">${w.used}% used</span></div><div class="bar thin"><span class="${M.level(w.used, 75, 90)}" style="width:${w.used}%"></span></div><div class="k"><span>Resets in ${w.resetsIn}</span></div></div>`).join("");
  $("plan").innerHTML = `Claude Max subscription on the <b>Website redesign</b> and <b>Fix login bug</b> chats; <b>Budget tracker</b> uses Imbue Cloud credits ($${t.budget.spentUsd.toFixed(2)} of $${t.budget.monthlyUsd} this month, ${t.budget.daysLeft} days left).`;
  const total = t.perChat.reduce((a, c) => a + c.cost, 0);
  $("chats").querySelector("tbody").innerHTML = t.perChat.map((c) => `<tr class="group"><td><span class="share"><i style="width:${(c.cost / total) * 100}%"></i></span>${M.esc(c.name)}</td><td class="n">${c.turns}</td><td class="n">${M.tokensShort(c.tokens)}</td><td class="n">$${c.cost.toFixed(2)}</td></tr>`).join("");
})();
</script>
</body>
</html>
